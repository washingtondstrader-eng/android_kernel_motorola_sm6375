
name: Build KernelSU for Moto G84 (bangkk)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Kernel Source
        uses: actions/checkout@v4
        with:
          ref: sixteen

      - name: Setup Build Environment
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential bc bison flex libssl-dev libelf-dev git ccache zip curl

      - name: Integrate KernelSU
        run: |
          curl -LSs "https://raw.githubusercontent.com/tiann/KernelSU/main/kernel/setup.sh" | bash -s main

      - name: Download Toolchain (AOSP Clang)
        run: |
          mkdir -p toolchain
          cd toolchain
          wget https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/main/clang-r488909.tar.gz
          mkdir clang && tar -zxvf clang-r488909.tar.gz -C clang
          cd ..

      - name: Configure & Enable KSU Flags
        run: |
          echo "CONFIG_KSU=y" >> arch/arm64/configs/vendor/bangkk_defconfig || true
          echo "CONFIG_KSU=y" >> arch/arm64/configs/bangkk_defconfig || true

      - name: Compile Kernel
        run: |
          export PATH=$GITHUB_WORKSPACE/toolchain/clang/bin:$PATH
          export ARCH=arm64
          export SUBARCH=arm64
          export CROSS_COMPILE=aarch64-linux-android-
          
          mkdir -p out
          make O=out ARCH=arm64 vendor/bangkk_defconfig || make O=out ARCH=arm64 bangkk_defconfig
          make -j$(nproc) O=out ARCH=arm64 CC=clang CLANG_TRIPLE=aarch64-linux-gnu-

      - name: Upload Kernel Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Moto-G84-KernelSU-Image
          path: out/arch/arm64/boot/Image.gz*

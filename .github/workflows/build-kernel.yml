name: Build KernelSU for Moto G84 (bangkk)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Kernel Source
        uses: actions/checkout@v4
        with:
          ref: sixteen

      - name: Setup Build Environment
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential bc bison flex libssl-dev libelf-dev git ccache zip curl gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi

      - name: Integrate KernelSU
        run: |
          curl -LSs "https://raw.githubusercontent.com/tiann/KernelSU/main/kernel/setup.sh" | bash -s main

      - name: Download Proton Clang
        run: |
          git clone --depth=1 https://github.com/kdrag0n/proton-clang.git clang

      - name: Fix Missing Headers & Techpack Werror
        run: |
          # Injeta o cabeçalho i2c.h que faltava no driver de áudio aw882xx
          sed -i '1s/^/#include <linux\/i2c.h>\n/' techpack/audio/asoc/codecs/aw882xx/aw882xx.c || true
          
          # Remove restrições de -Werror dos arquivos Makefile/Kbuild do techpack
          find techpack/ -name Makefile -exec sed -i 's/-Werror//g' {} + || true
          find techpack/ -name Kbuild -exec sed -i 's/-Werror//g' {} + || true

      - name: Configure Defconfig
        run: |
          echo "CONFIG_KSU=y" >> arch/arm64/configs/vendor/bangkk_defconfig || true
          echo "CONFIG_KSU=y" >> arch/arm64/configs/bangkk_defconfig || true
          echo "CONFIG_WERROR=n" >> arch/arm64/configs/vendor/bangkk_defconfig || true
          echo "CONFIG_WERROR=n" >> arch/arm64/configs/bangkk_defconfig || true

      - name: Compile Kernel
        run: |
          export PATH=$GITHUB_WORKSPACE/clang/bin:$PATH
          export ARCH=arm64
          export SUBARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_ARM32=arm-linux-gnueabi-
          
          mkdir -p out
          if [ -f arch/arm64/configs/vendor/bangkk_defconfig ]; then
            make O=out ARCH=arm64 CC=clang CROSS_COMPILE=aarch64-linux-gnu- KCFLAGS="-w" vendor/bangkk_defconfig
          else
            make O=out ARCH=arm64 CC=clang CROSS_COMPILE=aarch64-linux-gnu- KCFLAGS="-w" bangkk_defconfig
          fi
          
          make -j$(nproc) O=out ARCH=arm64 CC=clang CROSS_COMPILE=aarch64-linux-gnu- CROSS_COMPILE_ARM32=arm-linux-gnueabi- CLANG_TRIPLE=aarch64-linux-gnu- KCFLAGS="-w" CONFIG_WERROR=n

      - name: Upload Kernel Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Moto-G84-KernelSU-Image
          path: out/arch/arm64/boot/Image*
